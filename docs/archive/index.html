<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f2">
<title>SNAAC 지난 브리핑</title>
<meta name="description" content="SNAAC 모닝 브리핑 지난 회차 모아보기">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
  font-weight: 700;
  font-display: swap;
}

:root {
  --page: #f2f2f2;
  --surface: #ffffff;
  --surface-soft: #e9e9e9;
  --ink: #171717;
  --ink-2: #3f3f3f;
  --muted: #717171;
  --line: #d5d5d5;
  --line-strong: #b9b9b9;
  --shadow: 0 10px 30px rgba(20, 20, 18, .055);
  --radius: 18px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}
body.drawer-open { overflow: hidden; }
a { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
[hidden] { display: none !important; }

.wrap {
  width: min(100%, 600px);
  margin: 0 auto;
  padding: 0 18px calc(72px + env(safe-area-inset-bottom));
}

.masthead {
  padding: 18px 0 20px;
  border-bottom: 1px solid var(--ink);
}
.topline {
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  text-decoration: none;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .16em;
  white-space: nowrap;
}
.brand-mark {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink);
}
.top-actions { display: flex; align-items: center; gap: 7px; }
.utility-button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}
.utility-button:active { transform: scale(.98); }
.count-badge {
  min-width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 11px;
  line-height: 1;
}

.date-lockup {
  position: relative;
  padding: 28px 0 6px;
  min-height: 150px;
}
.kicker {
  margin: 0 0 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.date-big {
  margin: 0;
  font-family: GmarketSans, Pretendard, sans-serif;
  font-size: clamp(58px, 18vw, 88px);
  line-height: .95;
  letter-spacing: -.055em;
}
.date-sub {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}
.stamp {
  position: absolute;
  top: 27px;
  right: 2px;
  width: 76px;
  height: 76px;
  display: grid;
  place-content: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--ink-2);
  font-family: GmarketSans, Pretendard, sans-serif;
  font-size: 9px;
  line-height: 1.25;
  letter-spacing: .08em;
  text-align: center;
  transform: rotate(6deg);
}
.stamp strong { display: block; font-size: 15px; letter-spacing: 0; }

.intro {
  padding: 18px 0 8px;
}
.intro p {
  margin: 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.65;
}
.editorial-rule {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 14px;
}
.editorial-rule span {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
}

.cards { padding-top: 14px; }
.card {
  margin-bottom: 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.thumb {
  position: relative;
  display: block;
  aspect-ratio: 16 / 8.8;
  overflow: hidden;
  background: #dedede;
  text-decoration: none;
}
.thumb img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  filter: grayscale(100%) contrast(.92) brightness(.98);
  transform: scale(1.002);
}
.thumb::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, .12), transparent 42%);
  pointer-events: none;
}
.thumb.noimg {
  display: grid;
  place-items: center;
  background:
    linear-gradient(135deg, rgba(255,255,255,.52), transparent 55%),
    repeating-linear-gradient(135deg, #d6d6d6 0, #d6d6d6 12px, #e3e3e3 12px, #e3e3e3 24px);
}
.thumb.noimg::before {
  content: attr(data-initial);
  color: rgba(23, 23, 22, .72);
  font-family: GmarketSans, Pretendard, sans-serif;
  font-size: 44px;
  z-index: 1;
}
.media-label {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 2;
  min-height: 27px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 999px;
  background: rgba(20,20,18,.72);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  backdrop-filter: blur(6px);
}
.card-body { padding: 17px 17px 18px; }
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.meta-left { min-width: 0; display: flex; align-items: center; gap: 8px; }
.category {
  max-width: 72vw;
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0 9px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.source {
  min-width: 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-index {
  flex: 0 0 auto;
  color: var(--muted);
  font-family: GmarketSans, Pretendard, sans-serif;
  font-size: 11px;
}
.title-link { text-decoration: none; }
.card h2 {
  margin: 0;
  font-size: clamp(18px, 4.8vw, 20px);
  line-height: 1.42;
  letter-spacing: -.025em;
}
.summary {
  margin: 10px 0 0;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.68;
}
.takeaway {
  margin-top: 15px;
  padding: 13px 14px;
  border-left: 3px solid var(--ink);
  background: var(--surface-soft);
}
.takeaway-label {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .11em;
}
.takeaway p {
  margin: 0;
  color: var(--ink-2);
  font-size: 13.5px;
  line-height: 1.55;
}
.card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 15px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.read-link {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--ink);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 800;
}
.read-link::after { content: '↗'; font-size: 15px; }
.save-button {
  min-width: 84px;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 13px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: #fff;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}
.save-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.save-button.is-saved { background: var(--ink); border-color: var(--ink); color: #fff; }
.save-button.is-saved svg { fill: currentColor; }
.save-button:active { transform: scale(.97); }

.archive-section {
  margin-top: 42px;
  padding-top: 24px;
  border-top: 1px solid var(--line-strong);
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.section-head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
.section-head a {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
}
.archive-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}
.archive-row {
  min-height: 58px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 11px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
}
.archive-row:last-child { border-bottom: 0; }
.archive-date { font-size: 14px; font-weight: 800; }
.archive-count { color: var(--muted); font-size: 12px; }
.archive-arrow { color: var(--muted); font-size: 15px; }
.empty-archive {
  padding: 22px 16px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.archive-hero { padding: 32px 0 18px; border-bottom: 1px solid var(--ink); }
.archive-hero h1 {
  margin: 8px 0 6px;
  font-family: GmarketSans, Pretendard, sans-serif;
  font-size: clamp(35px, 10vw, 52px);
  line-height: 1.08;
  letter-spacing: -.045em;
}
.archive-hero p { margin: 0; color: var(--muted); font-size: 14px; }
.archive-page-list { margin-top: 22px; }

footer {
  margin-top: 44px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.8;
  text-align: center;
}

.drawer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.drawer-backdrop {
  position: absolute;
  inset: 0;
  border: 0;
  background: rgba(15, 15, 14, .48);
  cursor: pointer;
}
.drawer-panel {
  position: relative;
  width: min(100%, 600px);
  max-height: min(78vh, 720px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  background: var(--surface);
  box-shadow: 0 -18px 50px rgba(0,0,0,.16);
  padding-bottom: env(safe-area-inset-bottom);
  animation: drawer-up .18s ease-out both;
}
@keyframes drawer-up { from { transform: translateY(18px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
.drawer-handle { width: 42px; height: 4px; margin: 9px auto 2px; border-radius: 999px; background: var(--line-strong); }
.drawer-head {
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 17px;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 { margin: 0; font-size: 17px; }
.close-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  font-size: 20px;
  cursor: pointer;
}
.saved-list { overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 18px; }
.saved-empty { padding: 44px 18px; color: var(--muted); font-size: 14px; text-align: center; }
.saved-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.saved-item:last-child { border-bottom: 0; }
.saved-meta { margin-bottom: 4px; color: var(--muted); font-size: 11.5px; font-weight: 700; }
.saved-title { display: block; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 800; line-height: 1.45; }
.saved-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
.remove-saved {
  min-height: 36px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

@media (hover: hover) {
  .card { transition: transform .16s ease, box-shadow .16s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(20,20,18,.085); }
  .thumb img { transition: filter .2s ease, transform .25s ease; }
  .card:hover .thumb img { filter: grayscale(82%) contrast(.96); transform: scale(1.018); }
  .utility-button:hover, .save-button:hover, .close-button:hover { border-color: var(--ink); }
}

@media (max-width: 390px) {
  .wrap { padding-left: 14px; padding-right: 14px; }
  .utility-button { padding: 0 10px; }
  .utility-label-optional { display: none; }
  .stamp { width: 68px; height: 68px; top: 31px; }
  .stamp strong { font-size: 14px; }
  .card-body { padding-left: 15px; padding-right: 15px; }
  .source { max-width: 100px; }
  .archive-count { display: none; }
  .archive-row { grid-template-columns: 1fr auto; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topline" style="padding-top:18px">
    <a class="brand" href="../"><span class="brand-mark"></span>오늘 브리핑</a>
    <button class="utility-button" type="button" data-open-saved>저장함 <span class="count-badge" data-saved-count>0</span></button>
  </div>
  <header class="archive-hero">
    <p class="kicker">SNAAC morning archive</p>
    <h1>지난 브리핑</h1>
    <p>날짜를 눌러 그날 소개한 기사 5개를 다시 확인하세요.</p>
  </header>
  <main class="archive-page-list">
    <div class="archive-list"><a class="archive-row" href="2026-07-28.html"><span class="archive-date">2026년 7월 28일</span><span class="archive-count">5개의 큐레이션</span><span class="archive-arrow" aria-hidden="true">→</span></a></div>
  </main>
  <footer>
    아카이브 열람에는 별도 AI 호출이나 토큰 비용이 발생하지 않습니다.<br>
    SNAAC Community Team
  </footer>
</div>

<div class="drawer" id="savedDrawer" hidden>
  <button class="drawer-backdrop" type="button" data-close-saved aria-label="저장함 닫기"></button>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="savedTitle">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <h2 id="savedTitle">저장한 기사</h2>
      <button class="close-button" type="button" data-close-saved aria-label="닫기">×</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </section>
</div>
<p class="sr-only" id="saveStatus" aria-live="polite"></p>

<script id="briefingData" type="application/json">[]</script>
<script>
(() => {
  const STORAGE_KEY = 'snaac-saved-articles-v1';
  const dataElement = document.getElementById('briefingData');
  const liveRegion = document.getElementById('saveStatus');
  const drawer = document.getElementById('savedDrawer');
  const savedList = document.getElementById('savedList');
  const currentItems = dataElement ? JSON.parse(dataElement.textContent || '[]') : [];
  const currentByUrl = new Map(currentItems.map(item => [item.link, item]));
  let storageAvailable = true;
  let drawerTrigger = null;

  function readSaved() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      storageAvailable = false;
      return [];
    }
  }

  function writeSaved(items) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      storageAvailable = true;
      return true;
    } catch (error) {
      storageAvailable = false;
      return false;
    }
  }

  function announce(message) {
    if (!liveRegion) return;
    liveRegion.textContent = '';
    window.setTimeout(() => { liveRegion.textContent = message; }, 20);
  }

  function updateButtons() {
    const savedUrls = new Set(readSaved().map(item => item.link));
    document.querySelectorAll('.save-button').forEach(button => {
      const isSaved = savedUrls.has(button.dataset.url);
      button.classList.toggle('is-saved', isSaved);
      button.setAttribute('aria-pressed', String(isSaved));
      const label = button.querySelector('.save-label');
      if (label) label.textContent = isSaved ? '저장됨' : '저장';
    });
    document.querySelectorAll('[data-saved-count]').forEach(node => {
      node.textContent = String(savedUrls.size);
    });
  }

  function toggleSaved(url) {
    const item = currentByUrl.get(url);
    if (!item) return;

    const saved = readSaved();
    const index = saved.findIndex(entry => entry.link === url);
    let message = '';

    if (index >= 0) {
      saved.splice(index, 1);
      message = '저장을 취소했어요.';
    } else {
      saved.unshift({ ...item, savedAt: new Date().toISOString() });
      message = '저장함에 담았어요.';
    }

    if (!writeSaved(saved)) {
      announce('이 브라우저에서는 저장 기능을 사용할 수 없어요.');
      return;
    }
    updateButtons();
    renderSaved();
    announce(message);
  }

  function removeSaved(url) {
    const saved = readSaved().filter(item => item.link !== url);
    writeSaved(saved);
    updateButtons();
    renderSaved();
    announce('저장한 기사에서 삭제했어요.');
  }

  function renderSaved() {
    if (!savedList) return;
    const saved = readSaved();
    savedList.replaceChildren();

    if (!storageAvailable) {
      const note = document.createElement('p');
      note.className = 'saved-empty';
      note.textContent = '현재 브라우저의 저장 공간을 사용할 수 없어요.';
      savedList.append(note);
      return;
    }

    if (!saved.length) {
      const note = document.createElement('p');
      note.className = 'saved-empty';
      note.textContent = '아직 저장한 기사가 없어요. 카드 아래의 저장 버튼을 눌러보세요.';
      savedList.append(note);
      return;
    }

    saved.forEach(item => {
      const article = document.createElement('article');
      article.className = 'saved-item';

      const meta = document.createElement('div');
      meta.className = 'saved-meta';
      meta.textContent = [item.briefingDate, item.source].filter(Boolean).join(' · ');

      const link = document.createElement('a');
      link.className = 'saved-title';
      link.href = item.link;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = item.title || '제목 없음';

      const actions = document.createElement('div');
      actions.className = 'saved-actions';
      const removeButton = document.createElement('button');
      removeButton.type = 'button';
      removeButton.className = 'remove-saved';
      removeButton.dataset.removeUrl = item.link;
      removeButton.textContent = '삭제';
      actions.append(removeButton);

      article.append(meta, link, actions);
      savedList.append(article);
    });
  }

  function openDrawer() {
    if (!drawer) return;
    drawerTrigger = document.activeElement;
    renderSaved();
    drawer.hidden = false;
    document.body.classList.add('drawer-open');
    const closeButton = drawer.querySelector('.close-button');
    if (closeButton) closeButton.focus();
  }

  function closeDrawer() {
    if (!drawer) return;
    drawer.hidden = true;
    document.body.classList.remove('drawer-open');
    if (drawerTrigger && typeof drawerTrigger.focus === 'function') drawerTrigger.focus();
  }

  document.addEventListener('click', event => {
    const saveButton = event.target.closest('.save-button');
    if (saveButton) {
      toggleSaved(saveButton.dataset.url);
      return;
    }

    const openButton = event.target.closest('[data-open-saved]');
    if (openButton) {
      openDrawer();
      return;
    }

    const closeButton = event.target.closest('[data-close-saved]');
    if (closeButton) {
      closeDrawer();
      return;
    }

    const removeButton = event.target.closest('[data-remove-url]');
    if (removeButton) removeSaved(removeButton.dataset.removeUrl);
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && drawer && !drawer.hidden) closeDrawer();
  });

  window.addEventListener('storage', () => {
    updateButtons();
    renderSaved();
  });

  updateButtons();
  renderSaved();
})();
</script>
</body>
</html>
