name: SNAAC 모닝 브리핑

on:
  schedule:
    # UTC 23:30 = 한국시간(KST) 오전 08:30
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 로그인 기능용 공개 설정입니다. service_role/secret key는 절대 넣지 마세요.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # 아래 둘은 선택사항입니다.
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python main.py

      - name: GitHub Pages에 배포 (docs/ 커밋)
        run: |
          git config user.name "snaac-briefing-bot"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "브리핑 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 리프레시 토큰 자동 갱신
        if: hashFiles('new_refresh_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set KAKAO_REFRESH_TOKEN --body "$(cat new_refresh_token.txt)" --repo ${{ github.repository }}
          echo "리프레시 토큰 갱신 완료"
