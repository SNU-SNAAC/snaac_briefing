name: SNAAC 운영 대시보드 스냅샷

on:
  schedule:
    # UTC 22:30 = KST 07:30 (아침 브리핑 배포 이후)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: snaac-admin-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: 통합 대시보드 스냅샷 생성
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스냅샷 생성 및 저장
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIXPANEL_SERVICE_ACCOUNT_USERNAME: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_USERNAME }}
          MIXPANEL_SERVICE_ACCOUNT_SECRET: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_SECRET }}
          MIXPANEL_PROJECT_ID: ${{ vars.MIXPANEL_PROJECT_ID }}
        run: python admin_snapshot.py
